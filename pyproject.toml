[project]
name = "xps-wave"
version = "0.1.0"
description = "XPS spectrum peak deconvolution, peak table extraction, and element/chemical-state identification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lmfit>=1.3.4",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scipy>=1.18.0",
    "vamas>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xps_wave"]
